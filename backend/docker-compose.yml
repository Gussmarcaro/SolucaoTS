services:
  postgres:
    image: postgres:16-alpine
    container_name: solucaots-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: solucaots
      POSTGRES_PASSWORD: solucaots
      POSTGRES_DB: solucaots
    ports:
      - '5432:5432'
    volumes:
      - solucaots_pgdata:/var/lib/postgresql/data

volumes:
  solucaots_pgdata:
