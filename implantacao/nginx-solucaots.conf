# nginx da Solução TS — serve o frontend e faz proxy da API no mesmo domínio.
#
# Mesma origem de propósito: o navegador chama /api na própria URL, então não
# há CORS, nem segundo domínio, nem segundo deploy. É o que permite o
# VITE_API_URL ficar no padrão "/api".
#
#   cp implantacao/nginx-solucaots.conf /etc/nginx/sites-available/solucaots
#   ln -s /etc/nginx/sites-available/solucaots /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d app.seudominio.com.br

server {
    listen 80;
    listen [::]:80;

    # TROQUE pelo seu domínio. O certbot lê daqui ao emitir o certificado, e
    # reescreve este arquivo acrescentando o bloco 443.
    server_name app.seudominio.com.br;

    root /home/solucao/app/frontend/dist;
    index index.html;

    # Upload de PDF: o limite padrão do nginx é 1 MB, e a aplicação aceita até
    # 5 MB. Sem isto o anexo da nota falharia com 413 antes de chegar à API.
    client_max_body_size 8m;

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        # Sem estes cabeçalhos a API veria o IP do nginx como o de todos os
        # usuários — e o limite de tentativas de login trancaria o sistema
        # inteiro na décima senha errada de qualquer pessoa.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O Assistente responde em streaming (SSE): com buffer, a resposta só
        # apareceria toda de uma vez no fim.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- Frontend ------------------------------------------------------------
    # O SPA tem rotas próprias (/agenda, /prestacao-contas/:id). Sem o fallback
    # para index.html, recarregar a página numa dessas rotas daria 404 — o
    # arquivo não existe em disco, quem resolve o caminho é o React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets do build têm hash no nome, então nunca mudam de conteúdo: podem
    # ser guardados para sempre. O index.html NÃO — ele é quem aponta para o
    # bundle novo a cada versão, e em cache o usuário continuaria no antigo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
