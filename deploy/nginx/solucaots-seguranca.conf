# Cabeçalhos de segurança do Solução TS.
#
# Incluído no bloco `server` E em cada `location` que tem `add_header` próprio:
# no nginx, um `add_header` dentro de location apaga TODOS os herdados do
# server — sem repetir o include, a página principal sairia sem proteção.
#
# Aplicado por deploy/aplicar-seguranca-nginx.sh.

# Só HTTPS por um ano. Sem includeSubDomains: o site institucional e o
# e-mail ficam em subdomínios de outro servidor, que este não controla.
add_header Strict-Transport-Security "max-age=31536000" always;

# A página não pode ser embutida em outro site (golpe de "clique falso").
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# O que a página pode carregar. Script só do próprio site — é a barreira
# principal contra injeção de código, que importa porque o login fica no
# navegador. Estilo inline é liberado porque o React usa `style={...}`.
# Fora do site: fontes do Google, clima (Open-Meteo) e CEP (ViaCEP).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://viacep.com.br; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
