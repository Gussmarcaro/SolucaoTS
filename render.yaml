# Blueprint do Render — provisiona o banco (Postgres) + a API (backend).
# No Render: New → Blueprint → conecte o repositório. Ele lê este arquivo.
# Depois de publicar o frontend na Vercel, preencha APP_URL e CORS_ORIGIN
# (no painel do serviço) com a URL da Vercel e faça um redeploy.

databases:
  - name: solucaots-db
    plan: free

services:
  - type: web
    name: solucaots-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solucaots-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # o Render gera um segredo aleatório
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false # preencher com a URL da Vercel
      - key: CORS_ORIGIN
        sync: false # preencher com a URL da Vercel
      - key: RESET_TOKEN_TTL_MIN
        value: "30"
